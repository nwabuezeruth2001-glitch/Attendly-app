<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login — Attendly</title><link rel="stylesheet" href="assets/style.css"></head>
<body class="auth-page">
<section class="auth-visual"><div class="brand-lockup"><div class="brand-mark">🎓</div><h1>Attendly</h1><p>Track Attendance. Build Success.</p><p style="margin-top:28px;font-size:12px">A modern and simple attendance tracking application for students (or employees) with secure authentication, easy attendance management and insightful reports.</p></div></section>
<section class="auth-card-wrap"><div class="auth-card">
<h2>Welcome Back!</h2><p class="auth-subtitle">Sign in to your account</p>
<form onsubmit="event.preventDefault();location.href='dashboard.html'">
<div class="form-group"><label class="form-label">Email address</label><input class="form-control" type="email" placeholder="you@example.com" required></div>
<div class="form-group"><label class="form-label">Password</label><div class="password-wrap"><input class="form-control" type="password" placeholder="Enter your password" required><button type="button" class="password-toggle">◉</button></div></div>
<div class="auth-options"><label class="check"><input type="checkbox"> Remember me</label><a class="text-link" href="#">Forgot password?</a></div>
<button class="btn btn-primary btn-block">Login</button>
</form>
<div class="divider">or</div>
<div class="auth-footer">Don't have an account? <a class="text-link" href="register.html">Register</a></div>
</div></section>
<script src="assets/app.js"></script></body></html>
