<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — Attendly</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="sidebar-brand" href="dashboard.html"><span class="mini-logo">🎓</span><strong>Attendly</strong></a>
    <nav class="sidebar-nav">
      <div class="nav-section">Main Menu</div><a class="nav-item " href="dashboard.html"><span class="nav-icon">▦</span>Dashboard</a><a class="nav-item " href="students.html"><span class="nav-icon">♙</span>Students</a><a class="nav-item " href="attendance.html"><span class="nav-icon">✓</span>Attendance</a><a class="nav-item " href="attendance-history.html"><span class="nav-icon">◷</span>Attendance History</a><a class="nav-item active" href="reports.html"><span class="nav-icon">▤</span>Reports</a><a class="nav-item " href="settings.html"><span class="nav-icon">⚙</span>Settings</a>
    </nav>
    <div class="sidebar-user"><div class="avatar">AU</div><div class="user-meta"><strong>Admin User</strong><span>Administrator</span></div></div>
  </aside>
  <div class="overlay"></div>
  <main class="main">
    <header class="topbar">
      <button class="menu-btn" aria-label="Open menu">☰</button>
      <div class="search-wrap"><span>⌕</span><input class="global-search" placeholder="Search anything..."></div>
      <div class="topbar-spacer"></div>
      <button class="top-icon">♧<i class="dot"></i></button>
      <div class="profile-menu"><div class="avatar">AU</div><span>Admin⌄</span></div>
    </header>
    
<section class="page"><div class="page-head"><div><h1>Reports</h1><p>View attendance reports</p></div></div>
<div class="card"><div class="card-pad"><div class="actions" style="margin-bottom:15px"><button class="btn btn-primary">Student Report</button><button class="btn btn-outline">Overall Report</button></div>
<div class="filters"><div><label class="filter-label">Select Student</label><select class="form-control"><option>John Doe (CSC001)</option><option>Mary Jane (BUS002)</option><option>David Smith (MAT003)</option></select></div><div><label class="filter-label">Date Range</label><select class="form-control"><option>Last 30 days</option><option>Last 7 days</option><option>This semester</option></select></div><button class="btn btn-primary filter-button" onclick="location.href='student-report.html'">Generate Report</button></div></div></div>
<div class="grid-2 equal"><div class="card card-pad"><div class="report-profile"><div class="big-avatar">JD</div><div><strong>John Doe</strong><div style="font-size:10px;color:#71859a">Student ID: CSC001</div><div style="font-size:10px;color:#71859a">Department: Computer Science</div><div style="font-size:10px;color:#71859a">Level: ND2</div></div></div></div>
<div class="card card-pad"><h3 class="card-title" style="margin-bottom:13px">Attendance Summary</h3><div class="report-summary"><div class="summary-box"><small>Total Classes</small><strong>20</strong></div><div class="summary-box"><small>Present</small><strong style="color:var(--green)">17</strong></div><div class="summary-box"><small>Absent</small><strong style="color:var(--red)">3</strong></div><div class="summary-box"><small>Rate</small><strong>85%</strong></div></div></div></div>
</section>
  </main>
</div>
<script src="assets/app.js"></script>
</body>
</html>
