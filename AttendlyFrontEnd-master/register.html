<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Register — Attendly</title><link rel="stylesheet" href="assets/style.css"></head>
<body class="auth-page">
<section class="auth-visual"><div class="brand-lockup"><div class="brand-mark">🎓</div><h1>Attendly</h1><p>Track Attendance. Build Success.</p><div style="font-size:72px;margin-top:35px">📚</div></div></section>
<section class="auth-card-wrap"><div class="auth-card">
<h2>Create Your Account</h2><p class="auth-subtitle">Join us and start managing attendance</p>
<form onsubmit="event.preventDefault();location.href='dashboard.html'">
<div class="form-group"><label class="form-label">Full Name</label><input class="form-control" placeholder="Enter your full name" required></div>
<div class="form-group"><label class="form-label">Email address</label><input class="form-control" type="email" placeholder="you@example.com" required></div>
<div class="form-group"><label class="form-label">Password</label><div class="password-wrap"><input class="form-control" type="password" placeholder="Create a password" required><button type="button" class="password-toggle">◉</button></div></div>
<div class="form-group"><label class="form-label">Confirm Password</label><div class="password-wrap"><input class="form-control" type="password" placeholder="Confirm your password" required><button type="button" class="password-toggle">◉</button></div></div>
<button class="btn btn-primary btn-block">Register</button>
</form><div class="auth-footer">Already have an account? <a class="text-link" href="login.html">Login</a></div>
</div></section><script src="assets/app.js"></script></body></html>
